name: Spec gates

on:
  pull_request:
    paths:
      - "rfcs-md/**"
      - "rfcs-txt/**"
      - "rfc-src/**"
      - "schemas/**"
      - "specifications/**"
      - "catalog/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/rfc-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # check-rfc-sync.sh was retired by the format-spine ruling; these are
      # the live gates. gen-rfc-txt's diff gate needs the kramdown/xml2rfc
      # toolchain and runs locally pre-push instead. gen-rfcs-md.py's diff
      # gate is pure Python and runs here, under its stable name.
      - name: Vocabulary
        run: python3 scripts/check-vocabulary.py
      - name: Parity (rfcs-md/ generation)
        run: python3 scripts/check-parity.py
      - name: Repo hygiene
        run: python3 scripts/check-repo-hygiene.py
      - name: Declarations
        run: python3 scripts/check-declarations.py
      - name: Install conformance test dependencies
        run: python3 -m pip install jsonschema==4.26.0 cryptography==50.0.1 rfc8785==0.1.4
      - name: Capacity threshold regressions
        run: python3 scripts/test-envelope-thresholds.py
      - name: Risk Factor weight regressions
        run: python3 scripts/test-risk-factor-weights.py
      - name: Emergency policy regressions
        run: python3 scripts/test-emergency-policy.py
      - name: Oracle consensus regressions
        run: python3 scripts/test-oracle-consensus.py
      - name: Trajectory signature regressions
        run: python3 scripts/test-trajectory-signatures.py
      - name: Operational readiness regressions
        run: python3 scripts/test-readiness.py
      - name: Human eligibility and erasure accounting regressions
        run: python3 scripts/test-human-eligibility.py
      - name: Encrypted privacy evidence regressions
        run: python3 scripts/test-privacy-evidence.py
      - name: Catalogue tables
        run: python3 scripts/gen-catalog-tables.py --check
