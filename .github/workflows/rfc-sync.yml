name: Spec gates

on:
  # Runs on every pull request. `gates` is a required status check on main,
  # and a required check that never reports blocks the merge forever, so the
  # earlier path filter (which skipped PRs touching only governance files)
  # had to go. The whole sequence takes about twenty seconds.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install conformance test dependencies
        run: python3 -m pip install jsonschema==4.26.0 cryptography==50.0.1 rfc8785==0.1.4
      # #182 keeps generated release documents out of source PRs. Render and
      # validate in a temporary tracked tree; retain the required gates status.
      - name: Source and conformance gates
        run: bash scripts/check-all.sh
